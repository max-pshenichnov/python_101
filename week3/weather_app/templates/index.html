<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if error %}Ошибка{% else %}{{ w.city }}{% endif %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <video autoplay muted loop playsinline>
        <source src="static/sky.mp4" type="video/mp4">
    </video>
    <main>
        {% if error %}
            <div class="error" id="error-message" role="alert">{{ error }}</div>
        {% else %}
            <div class="city">{{w.city}}</div>
            <div class="temp"><span id="temp">{{w.temp}}</span>°</div>
            <div class="condition">
                <span class="weather-emoji" id="emoji" role="img" aria-label="Погодные условия">{{w.emoji}}</span>
                <span class="text" id="text">{{w.text}}</span>
            </div>
            <div class="time"></div>
            <div class="feels">ощущается как <span id="feels">{{w.feels}}</span>°</div>
        {% endif %}
        <form class="city-form" action="/" method="get">
            <input
                type="text"
                name="city"
                value="{{ city }}"
                placeholder="Введите город"
                aria-label="Название города"
                aria-invalid="{{ 'true' if error else 'false' }}"
                {% if error %}aria-describedby="error-message"{% endif %}
                required
            >
            <button type="submit">Показать погоду</button>
        </form>
    </main>
</body>

</html>
